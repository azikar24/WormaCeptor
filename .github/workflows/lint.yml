name: Code Quality

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Secret Scanning - Runs first to catch leaked credentials immediately
  # ==========================================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Code Formatting Check
  # ==========================================================================
  spotless:
    name: Formatting (Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check Formatting
        run: ./gradlew spotlessCheck

  # ==========================================================================
  # Static Analysis
  # ==========================================================================
  detekt:
    name: Static Analysis (Detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: detekt-report
          path: '**/build/reports/detekt/'

  # ==========================================================================
  # Android Lint
  # ==========================================================================
  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: '**/build/reports/lint-results*.html'

  # ==========================================================================
  # Dependency Analysis (Unused/Misused Dependencies)
  # ==========================================================================
  dependency-analysis:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    continue-on-error: true # Informational, don't block PRs
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Analyze Dependencies
        run: ./gradlew buildHealth

      - name: Upload Dependency Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-analysis
          path: build/reports/dependency-analysis/

  # ==========================================================================
  # API Compatibility Check (for library modules)
  # ==========================================================================
  api-compatibility:
    name: API Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check API Compatibility
        run: ./gradlew apiCheck

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            **/build/test-results/test*/**/*.xml
            **/build/reports/tests/

  # ==========================================================================
  # Code Coverage (gated at 50% via koverVerify)
  # ==========================================================================
  coverage:
    name: Code Coverage (Kover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Coverage Verification
        run: ./gradlew koverVerify koverXmlReport koverHtmlReport

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/kover/

  # ==========================================================================
  # Architecture Tests
  # ==========================================================================
  architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Architecture Tests
        run: ./gradlew :test:architecture:test

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: architecture-test-results
          path: test/architecture/build/reports/tests/

  # ==========================================================================
  # Summary Job - Requires all critical checks to pass
  # ==========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - spotless
      - detekt
      - android-lint
      - api-compatibility
      - architecture
      - unit-tests
      - coverage
    if: always()
    env:
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      SPOTLESS_RESULT: ${{ needs.spotless.result }}
      DETEKT_RESULT: ${{ needs.detekt.result }}
      LINT_RESULT: ${{ needs.android-lint.result }}
      API_RESULT: ${{ needs.api-compatibility.result }}
      ARCH_RESULT: ${{ needs.architecture.result }}
      UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
    steps:
      - name: Check all required jobs
        run: |
          echo "Checking job results..."

          if [[ "$SECRET_SCAN_RESULT" != "success" ]]; then
            echo "Secret scanning failed!"
            exit 1
          fi

          if [[ "$SPOTLESS_RESULT" != "success" ]]; then
            echo "Formatting check failed!"
            exit 1
          fi

          if [[ "$DETEKT_RESULT" != "success" ]]; then
            echo "Static analysis failed!"
            exit 1
          fi

          if [[ "$LINT_RESULT" != "success" ]]; then
            echo "Android Lint failed!"
            exit 1
          fi

          if [[ "$API_RESULT" != "success" ]]; then
            echo "API compatibility check failed!"
            exit 1
          fi

          if [[ "$ARCH_RESULT" != "success" ]]; then
            echo "Architecture tests failed!"
            exit 1
          fi

          if [[ "$UNIT_TESTS_RESULT" != "success" ]]; then
            echo "Unit tests failed!"
            exit 1
          fi

          if [[ "$COVERAGE_RESULT" != "success" ]]; then
            echo "Coverage verification failed!"
            exit 1
          fi

          echo "All quality checks passed!"
