name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # Publish library artifacts to Maven Central (Sonatype Central Portal)
  # ==========================================================================
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish to Maven Central
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace

  # ==========================================================================
  # Build, sign, and upload demo app .aab to Play Store internal track
  # ==========================================================================
  publish-playstore:
    name: Upload demo app to Play Store
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Decode Play Store service account
        env:
          PLAY_SA_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SA_JSON" | base64 -d > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_STORE_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: ./gradlew :app:bundleRelease

      - name: Publish to Play Store (internal track)
        run: ./gradlew :app:publishReleaseBundle --track internal

      - name: Upload mapping for crash deobfuscation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ github.event.release.tag_name }}
          path: app/build/outputs/mapping/release/mapping.txt

  # ==========================================================================
  # Attach .aab + mapping.txt to the GitHub Release
  # ==========================================================================
  attach-artifacts:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: publish-playstore
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release artifacts
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Attach .aab, .apk, mapping.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "app/build/outputs/bundle/release/app-release.aab" \
            "app/build/outputs/apk/release/app-release.apk" \
            "app/build/outputs/mapping/release/mapping.txt" \
            --clobber

  # ==========================================================================
  # Trigger WormaCeptorWeb content sync via repository_dispatch
  # ==========================================================================
  notify-website:
    name: Trigger WormaCeptorWeb sync
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_VERSION: ${{ github.event.release.name }}
      RELEASE_URL: ${{ github.event.release.html_url }}
    steps:
      - name: Send repository_dispatch to WormaCeptorWeb
        env:
          DISPATCH_TOKEN: ${{ secrets.PAT_WEBSITE_DISPATCH }}
        run: |
          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "PAT_WEBSITE_DISPATCH not set; skipping website sync trigger."
            exit 0
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/azikar24/WormaCeptorWeb/dispatches \
            -d "$(jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg version "$RELEASE_VERSION" \
              --arg url "$RELEASE_URL" \
              '{event_type: "wormaceptor-released", client_payload: {tag: $tag, version: $version, release_url: $url}}')"
